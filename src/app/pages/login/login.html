<div class="container">
  <div class="illustration-panel"></div>
  <div class="form-panel">
    <div class="login-card" @flyInRight>
      <div class="Header">Welcome to <span class="app-name">NotesLib</span></div>

      <div class="subtitle-wrapper">
        <p class="typing-effect typing-login">Log in to manage your notes.</p>
      </div>

      @if (globalError) {
        <div class="error-message">
          {{ globalError }}
        </div>
      }

      <div class="form-group">
        <label for="email">Enter Email:</label>
        <input
          type="email"
          id="email"
          placeholder="eg. john@example.com"
          [(ngModel)]="email"
          [disabled]="isLoading"
        />
        @if (emailError) {
          <div class="error-text">
            {{ emailError }}
          </div>
        }
      </div>
      <div class="form-group">
        <label for="password">Enter Password:</label>
        <input
          type="password"
          id="password"
          placeholder="It should be at least 6 characters long"
          [(ngModel)]="password"
          [disabled]="isLoading"
        />

        @if (passwordError) {
          <div class="error-text">
            {{ passwordError }}
          </div>
        }
      </div>
      <button class="login-btn" (click)="onLogin()" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

      <div class="signup-row">
        <span class="prompt-text">Create new one ?</span>
        <a routerLink="/signUp" class="signup-link">Sign Up</a>
      </div>
    </div>
  </div>
</div>
