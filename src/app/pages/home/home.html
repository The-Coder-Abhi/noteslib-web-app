<div class="dashboard-layout">
    <app-sidebar></app-sidebar>

    <div class="main-content">
        <header class="topbar">
            <div class="greeting">
                <span class="welcome-text">Welcome 👋</span>
                <h1 class="userName">{{ userName }}</h1>
            </div>

            <div class="notification-wrapper">
                <button class="bell-icon" (click)="toggleNotifications()">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    @if(pendingRequests.length > 0){
                        <span class="notification-badge">{{ pendingRequests.length }}</span>
                    }
                </button>

                <!-- The 5-second Toast Notification -->
    @if(newRequestToast) {
        <div class="toast-card">
            <div class="toast-content">
                <svg width="20" height="20" fill="none" stroke="var(--primary-color)" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span>{{ newRequestToast }}</span>
            </div>
        </div>
    }

                @if(showNotifications){
                    <div class="notification-panel">
                        <h3>Pending Access Requests</h3>

                        @for(req of pendingRequests; track req.noteId + req.requesterId){
                            <div class="request-item">
                                <p><strong>{{req.requesterName}}</strong> wants to view <strong>{{req.noteName}}</strong></p>
                                <button class="accept-btn" (click)="acceptRequest(req.noteId, req.requesterId)">Accept</button>
                            </div>
                        }@empty {
                            <p class="empty-text">You have no pending requests.</p>
                        }
                    </div>
                }
            </div>
        </header>
        <main class="page-container">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
