<div class="container">
  <div class="illustration-panel"></div>
  <div class="form-panel">
    <div class="login-card">
      @if (!isSuccess) {
        <div class="BackButtonContainer">
          <button class="back-button" aria-label="Go back" routerLink="/signUp">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5" />
              <path d="M12 19l-7-7 7-7" />
            </svg>
          </button>
        </div>
        <div class="Header">Check your <span class="app-name">Inbox</span></div>
        <div class="icon">
          <img src="assets/img/VerifyIcon.png" alt="Verify" />
        </div>
        <div class="subtitle-wrapper">
          <p class="typing-effect typing-login" [class.error-text]="isError">{{ message }}</p>
        </div>
        <button
          class="btn"
          (click)="checkStatus()"
          [disabled]="isCheckingStatus || isVerifyingLink"
        >
          {{ isCheckingStatus ? 'Checking...' : isVerifyingLink ? 'Verifying...' : 'Verify' }}
        </button>
      } @else {
        <!-- NEW SUCCESS UI -->
        <div class="success-container">
          <div class="success-animation">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
              <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
              <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
            </svg>
          </div>

          <div class="Header">Verification <span class="app-name">Successful</span></div>
          <p class="success-message">Your email has been securely verified.</p>

          <p class="countdown-text">
            Redirecting to home in <strong>{{ countdown }}</strong> seconds...
          </p>

          <button class="btn success-btn" (click)="goToHome()">Go to Home Now</button>
        </div>
      }
    </div>
  </div>
</div>
