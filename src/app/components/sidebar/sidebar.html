<aside class="sidebar">
  <div class="brand">NotesLib</div>
  <nav>
  <a routerLink="/home" [class.active]="isHomeActive()" class="nav-item">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span class="nav-text">Home</span>
  </a>
  <a routerLink="/home/search" routerLinkActive="active" class="nav-item">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span class="nav-text">Search Notes</span>
  </a>
  <a routerLink="/home/add" routerLinkActive="active" class="nav-item">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="12" y1="8" x2="12" y2="16"></line>
      <line x1="8" y1="12" x2="16" y2="12"></line>
    </svg>
    <span class="nav-text">Add Notes</span>
  </a>
</nav>

  <div class="profile-section">
    <div class="profile-info">
      <!-- Generates a circular avatar with the first letter of their name -->
      <div class="avatar">{{ userName.charAt(0).toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-name">{{ userName }}</span>
        <span class="user-email">{{ userEmail }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" title="Sign Out">
      <svg
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</aside>
